name: PR dev build

# This workflow deliberately does not subscribe to `synchronize`: a dev build
# is expensive, while unit and lint checks run on every commit. After a new
# commit, dispatch this workflow for that PR head SHA before merging.
# Do not use pull_request_target or add secrets/write permissions here.
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      ref:
        description: "PR head commit SHA to build"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pr-dev-build-${{ github.event.pull_request.number || inputs.ref }}
  cancel-in-progress: false

jobs:
  dev-build:
    name: Dev build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Enable pinned pnpm
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@8.11.0 --activate
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libayatana-appindicator3-dev libgtk-3-dev librsvg2-dev libwebkit2gtk-4.1-dev
      - name: Create development build without bundles
        run: pnpm tauri build --debug --no-bundle
      - name: Write build report
        if: always()
        run: |
          {
            echo "## Development build"
            echo
            echo "- Checked-out commit: \`$(git rev-parse HEAD)\`"
            echo "- Mode: debug, no installer bundle"
            echo "- Result: \`${{ job.status }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
