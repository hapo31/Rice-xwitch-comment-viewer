name: Bouyomi transport errors
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transport-errors:
    name: Transport errors (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux keyring build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - name: Use reviewed release Rust
        shell: pwsh
        run: |
          $releaseRust = (Get-Content build/release-inputs.json -Raw | ConvertFrom-Json).rustVersion
          rustup toolchain install $releaseRust --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup override set $releaseRust
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test typed errors, native OS mapping and fake transport
        if: runner.os == 'Linux'
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features speech::bouyomi::
      - name: Test deterministic queue and model contracts on both platforms
        shell: pwsh
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features speech::worker::tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features speech::tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features speech::outcome::tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features app_events::tests::item_outcome_survives_latest_snapshot_and_unrelated_activity_without_warning -- --exact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test Launcher service adapters and resource boundaries on both platforms
        shell: pwsh
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features launcher::
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features resource_limits::
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features settings::tests::bounded_request_rejects_backend_fields_new_ids_and_large_json -- --exact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features settings::tests::over_quota_and_large_serialization_leave_memory_primary_backup_and_temps_unchanged -- --exact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features settings::tests::oversized_primary_and_backup_are_quarantined_without_full_read -- --exact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features settings::tests::maximum_launcher_roundtrip_stays_within_time_and_rust_heap_budget -- --exact --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test settings domain and all Bouyomi destination policies on both platforms
        shell: pwsh
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features settings::validation::tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features settings::schema::tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features settings::tests::invalid_repeat_suppression_defaults_only_that_field_without_a_notice -- --exact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features settings::tests::invalid_wire_and_domain_patch_never_save_publish_or_change_either_file -- --exact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features settings::tests::manually_edited_settings_cannot_persist_or_forge_remote_consent -- --exact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features speech::destination::tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test native Windows error mapping and transport phases
        # #77 owns typed/native errors, bounded writes and protocol responses.
        # Full Windows dispatcher/launcher/runtime coverage remains #91.
        if: runner.os == 'Windows'
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features speech::bouyomi::error::
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features speech::bouyomi::tests::write_timeout_and_io_failure_keep_the_write_phase -- --exact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features speech::bouyomi::tests::refused_endpoint_is_not_connected -- --exact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features speech::bouyomi::tests::health_and_diagnostics_require_valid_protocol_responses -- --exact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
