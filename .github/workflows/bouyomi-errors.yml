name: Bouyomi transport errors
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transport-errors:
    name: Transport errors (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - name: Install Linux keyring build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - name: Use reviewed release Rust
        shell: pwsh
        run: |
          $releaseRust = (Get-Content build/release-inputs.json -Raw | ConvertFrom-Json).rustVersion
          rustup toolchain install $releaseRust --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup override set $releaseRust
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test typed errors, native OS mapping and fake transport
        if: runner.os == 'Linux'
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features speech::bouyomi::
      - name: Test native Windows error mapping and transport phases
        # #77 owns typed/native errors, bounded writes and protocol responses.
        # Full Windows dispatcher/launcher/runtime coverage remains #91.
        if: runner.os == 'Windows'
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features speech::bouyomi::error::
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features speech::bouyomi::tests::write_timeout_and_io_failure_keep_the_write_phase -- --exact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features speech::bouyomi::tests::refused_endpoint_is_not_connected -- --exact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features speech::bouyomi::tests::health_and_diagnostics_require_valid_protocol_responses -- --exact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
