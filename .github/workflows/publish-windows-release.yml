name: Publish Windows release

# workflow_run executes this workflow definition from the default branch. The
# tag-triggered build therefore never receives a contents:write token.
on:
  workflow_run:
    workflows: ["Release Windows"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: publish-windows-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  repository-policy:
    name: Verify release repository
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.path == '.github/workflows/release-windows.yml' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify default branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-release-repository-policy.mjs "${GITHUB_REPOSITORY}"

  release:
    name: Publish verified GitHub Release
    needs: repository-policy
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.path == '.github/workflows/release-windows.yml' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
      RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha }}
      RELEASE_RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - name: Checkout trusted release policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false

      - name: Checkout event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          path: source
          persist-credentials: false

      - name: Download release provenance
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rice-release-provenance-${{ github.event.workflow_run.head_branch }}
          path: release-provenance
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify build provenance and immutable tag
        id: release-source
        run: |
          set -euo pipefail
          provenance="${GITHUB_WORKSPACE}/release-provenance/release-provenance.json"
          jq -e '
            type == "object" and
            .schemaVersion == 1 and
            (.tag | type == "string") and
            (.tagObject | type == "string") and
            (.commit | type == "string")
          ' "${provenance}" >/dev/null

          provenance_tag="$(jq -er '.tag' "${provenance}")"
          provenance_tag_object="$(jq -er '.tagObject' "${provenance}")"
          provenance_commit="$(jq -er '.commit' "${provenance}")"
          if [ "${provenance_tag}" != "${RELEASE_TAG}" ]; then
            echo "エラー: provenance tag (${provenance_tag}) が workflow run tag (${RELEASE_TAG}) と一致しません。" >&2
            exit 1
          fi
          if [ "${provenance_commit}" != "${RELEASE_COMMIT}" ]; then
            echo "エラー: provenance commit (${provenance_commit}) が workflow run commit (${RELEASE_COMMIT}) と一致しません。" >&2
            exit 1
          fi
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "エラー: タグ名は vX.Y.Z 形式で指定してください: ${RELEASE_TAG}" >&2
            exit 64
          fi

          git -C source fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "refs/tags/${RELEASE_TAG}:refs/rice/release-tag"
          (
            cd source
            ../trusted/scripts/verify-release-tag.sh "${RELEASE_TAG}" \
              --tag-ref refs/rice/release-tag \
              --expected-tag-object "${provenance_tag_object}" \
              --expected-commit "${RELEASE_COMMIT}" \
              --checkout-ref HEAD \
              --main-ref refs/remotes/origin/main
            RICE_RELEASE_ROOT="${PWD}" \
              ../trusted/scripts/verify-release-version.sh "${RELEASE_TAG#v}" --tag "${RELEASE_TAG}"

            # Keep the verified snapshot for --notes-from-tag. Do not fetch the
            # mutable remote tag again in this job.
            git update-ref "refs/tags/${RELEASE_TAG}" "${provenance_tag_object}"
          )
          echo "tag-object=${provenance_tag_object}" >> "${GITHUB_OUTPUT}"

      - name: Download release artifact bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rice-windows-${{ github.event.workflow_run.id }}
          path: release-artifacts
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify downloaded asset checksums
        run: |
          set -euo pipefail
          cd release-artifacts
          test -n "$(find . -maxdepth 1 -type f -name '*.exe' -print -quit)"
          test -n "$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)"
          sha256sum --check --strict SHA256SUMS.txt

      - name: Download Windows smoke receipt from the same run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rice-windows-smoke-${{ github.event.workflow_run.id }}
          path: windows-smoke
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Require exact artifact manifest and actual successful Windows jobs
        env:
          GH_TOKEN: ${{ github.token }}
          RICE_RELEASE_ROOT: ${{ github.workspace }}/source
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${RELEASE_RUN_ID}/jobs?filter=latest&per_page=100" --jq '.jobs[] | @json' > release-jobs.ndjson
          node trusted/scripts/verify-windows-smoke.mjs release-artifacts \
            windows-smoke/windows-smoke-report.json release-jobs.ndjson \
            "${RELEASE_RUN_ID}" "${RELEASE_TAG}" "${RELEASE_COMMIT}"

      - name: Create or update release safely
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_TAG_OBJECT: ${{ steps.release-source.outputs.tag-object }}
        run: |
          set -euo pipefail
          node trusted/scripts/verify-release-repository-policy.mjs "${GITHUB_REPOSITORY}"
          assets=("${GITHUB_WORKSPACE}"/release-artifacts/*)
          (
            cd source
            ../trusted/scripts/publish-release.sh \
              "${RELEASE_TAG}" \
              "${GITHUB_REPOSITORY}" \
              "${EXPECTED_TAG_OBJECT}" \
              "${assets[@]}"
          )
