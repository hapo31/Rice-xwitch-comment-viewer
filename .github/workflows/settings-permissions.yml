name: Settings permissions
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-app-data:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - name: Use supported release Rust
        run: |
          $releaseRust = (Get-Content build/release-inputs.json -Raw | ConvertFrom-Json).rustVersion
          rustup toolchain install $releaseRust --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup override set $releaseRust
      - name: Verify application settings directory, replacement, backup and temporary ACLs
        run: cargo test --locked --no-default-features --manifest-path src-tauri/Cargo.toml settings::tests::settings_in_app_data_inherit_only_current_user_and_system_acl -- --exact
