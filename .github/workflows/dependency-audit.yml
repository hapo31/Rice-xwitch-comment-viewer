name: Dependency audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.22.0"
      - name: Install pinned SBOM tooling
        run: |
          corepack enable
          corepack prepare pnpm@8.11.0 --activate
          pnpm install --frozen-lockfile
      - name: Install fixed audit tools
        run: |
          npm install --global pnpm@8.11.0
          pnpm install --frozen-lockfile --ignore-scripts
          cargo install --locked --version 0.22.2 cargo-audit
      - name: Validate exception policy and run advisory scans
        run: |
          node --test scripts/test-audit-policy.mjs scripts/test-sbom.mjs
          node scripts/dependency-audit.mjs
      - name: Preserve findings even when policy blocks release
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dependency-audit-${{ github.run_id }}
          path: audit-reports/
          if-no-files-found: warn
          retention-days: 30
