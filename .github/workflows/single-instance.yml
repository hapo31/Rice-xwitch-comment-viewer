name: Native single instance
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  windows-focus:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Windows test runner and artifact smoke syntax
        run: |
          foreach ($file in @('scripts/run-windows-test.ps1', 'scripts/smoke-windows-artifacts.ps1', 'scripts/windows-capability-native.ps1')) {
            $tokens = $null
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE $file), [ref]$tokens, [ref]$errors)
            if ($errors.Count -ne 0) { $errors | Format-List; throw "PowerShell parse failed: $file" }
          }
      - name: Read reviewed compiler inputs
        id: inputs
        run: |
          $inputs = Get-Content build/release-inputs.json -Raw | ConvertFrom-Json
          "node=$($inputs.nodeVersion)" >> $env:GITHUB_OUTPUT
          "rust=$($inputs.rustVersion)" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.inputs.outputs.node }}
      - name: Validate packaged capability probes and native UI helper
        run: |
          node --test scripts/test-tauri-security.mjs scripts/test-windows-capabilities.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Capability policy tests failed' }
          & powershell.exe -NoProfile -STA -ExecutionPolicy RemoteSigned -File scripts/windows-capability-native.ps1 -RicePid 1 -FixtureRoot (Join-Path $env:RUNNER_TEMP 'rice-helper-compile') -ValidateOnly
          if ($LASTEXITCODE -ne 0) { throw 'Native UI helper compilation failed' }
      - name: Build the real embedded frontend
        run: |
          corepack enable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          corepack prepare pnpm@8.11.0 --activate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm install --frozen-lockfile --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Use reviewed Rust
        env:
          REVIEWED_RUST: ${{ steps.inputs.outputs.rust }}
        run: |
          rustup toolchain install $env:REVIEWED_RUST --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup override set $env:REVIEWED_RUST
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build the native library test harness
        id: harness
        run: |
          $records = cargo test --locked --all-targets --all-features --no-run --message-format=json --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $binaries = @($records | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object {
            $_.reason -eq 'compiler-artifact' -and $_.target.name -eq 'rice_lib' -and $_.profile.test -and $_.executable
          } | ForEach-Object { $_.executable })
          if ($binaries.Count -ne 1) { throw "Expected exactly one native library test binary" }
          "binary=$($binaries[0])" >> $env:GITHUB_OUTPUT
      - name: Embed the same Common Controls v6 requirement used by the production app
        env:
          RICE_NATIVE_TEST_BINARY: ${{ steps.harness.outputs.binary }}
        run: |
          # tauri-build links its manifest into normal binaries, not the libtest
          # harness. rfd's TaskDialogIndirect requires Common Controls v6 before
          # test main; a default v5 DLL would cause STATUS_ENTRYPOINT_NOT_FOUND.
          $sdkBin = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          $mt = Get-ChildItem -LiteralPath $sdkBin -Filter mt.exe -Recurse -File |
            Where-Object { $_.DirectoryName -match '\\x64$' } |
            Sort-Object FullName | Select-Object -Last 1
          if (-not $mt) { throw "Windows SDK manifest tool is required" }
          & $mt.FullName -manifest src-tauri/tests/native-windows.manifest "-outputresource:$($env:RICE_NATIVE_TEST_BINARY);#1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run all Windows targets and features, including native credentials and process adapters
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUNNER: pwsh -NoProfile -File ${{ github.workspace }}/scripts/run-windows-test.ps1
        run: |
          cargo test --locked --all-targets --all-features --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify Launcher service and filesystem boundary with production features
        env:
          RICE_NATIVE_TEST_BINARY: ${{ steps.harness.outputs.binary }}
        run: |
          & $env:RICE_NATIVE_TEST_BINARY launcher:: --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify real second launch exits, preserves settings and restores foreground window
        # This explicitly runs the headful test. Missing WebView2/desktop or
        # failed restoration is a failure, never a skipped smoke result.
        env:
          RICE_NATIVE_TEST_BINARY: ${{ steps.harness.outputs.binary }}
        run: |
          & $env:RICE_NATIVE_TEST_BINARY single_instance::windows_tests::native_two_process_restore_and_focus --exact --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify maximum Launcher rendering, heap budget and production IPC rejection
        env:
          RICE_NATIVE_TEST_BINARY: ${{ steps.harness.outputs.binary }}
        run: |
          & $env:RICE_NATIVE_TEST_BINARY single_instance::windows_tests::native_maximum_launcher_render_and_ipc_budget --exact --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify future settings survive startup, rejected production IPC and normal exit
        env:
          RICE_NATIVE_TEST_BINARY: ${{ steps.harness.outputs.binary }}
        run: |
          & $env:RICE_NATIVE_TEST_BINARY single_instance::windows_tests::native_future_settings_preserved_through_ipc_and_exit --exact --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
