name: PR and main quality

# Untrusted PR code has read-only credentials and no secrets.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: ./.github/workflows/quality-checks.yml

  release-policy:
    name: Release policy tests
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.0"
      - name: Install locked parser dependencies
        run: |
          corepack enable
          corepack prepare pnpm@8.11.0 --activate
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Test release tag, version and build input verification
        run: |
          set -euo pipefail
          scripts/test-verify-release-tag.sh
          scripts/test-verify-release-version.sh
          scripts/test-publish-release.sh
          node --test scripts/test-release-repository-policy.mjs
          node --test scripts/test-release-build-inputs.mjs
          node --test scripts/test-release-artifacts.mjs scripts/test-windows-smoke.mjs
          node --test scripts/test-tauri-versions.mjs
          node --test scripts/test-config-parsers.mjs scripts/test-release-workflow-policy.mjs
          node --test scripts/test-checkout-materials.mjs
          node --test scripts/test-tauri-security.mjs
          node --test scripts/test-windows-capabilities.mjs
          scripts/check-docker-context.sh
      - name: Check release workflow privilege boundary
        run: node scripts/verify-release-workflow-policy.mjs
      - name: Verify project license consistency and packaging policy
        run: |
          node scripts/verify-project-license.mjs
          node --test scripts/test-project-license.mjs
