name: Release Windows

on:
  push:
    tags:
      - "v[0-9]*"
  # Candidate verification creates no tag or Release. The default-branch
  # publisher accepts only tag push runs, never this manual event.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Shared release quality
    uses: ./.github/workflows/quality-checks.yml

  windows-tests:
    name: Windows production tests
    uses: ./.github/workflows/single-instance.yml

  build-windows:
    name: Test and build Windows installer and zip
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: quality
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      DOCKER_BUILDKIT: "1"
      RICE_TWITCH_CLIENT_ID: ${{ vars.RICE_TWITCH_CLIENT_ID || secrets.RICE_TWITCH_CLIENT_ID }}
      EXPECTED_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
    steps:
      - name: Checkout annotated tag
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Test release guards
        run: |
          node scripts/verify-project-license.mjs
          node scripts/verify-tauri-versions.mjs
          node --test scripts/test-tauri-versions.mjs
          node --test scripts/test-checkout-materials.mjs
          node --test scripts/test-tauri-security.mjs
          node --test scripts/test-windows-capabilities.mjs
          node --test scripts/test-project-license.mjs
          node scripts/test-twitch-client-id.mjs
          bash scripts/test-publish-release.sh

      - name: Verify Twitch authentication configuration
        run: node scripts/verify-twitch-client-id.mjs

      - name: Verify immutable release source
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "エラー: タグ名は vX.Y.Z 形式で指定してください: ${GITHUB_REF_NAME}" >&2
            exit 64
          fi
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "refs/tags/${GITHUB_REF_NAME}:refs/rice/release-tag"
          scripts/verify-release-tag.sh "${GITHUB_REF_NAME}" \
            --tag-ref refs/rice/release-tag \
            --expected-commit "${GITHUB_SHA}" \
            --checkout-ref HEAD \
            --main-ref refs/remotes/origin/main

          tag_object="$(git rev-parse refs/rice/release-tag^{tag})"
          jq -n \
            --arg tag "${GITHUB_REF_NAME}" \
            --arg tagObject "${tag_object}" \
            --arg commit "${GITHUB_SHA}" \
            '{schemaVersion: 1, tag: $tag, tagObject: $tagObject, commit: $commit}' \
            > release-provenance.json

      - name: Verify manifest and tag versions
        run: |
          set -euo pipefail
          if [ -n "${EXPECTED_TAG}" ]; then
            scripts/verify-release-version.sh "${EXPECTED_TAG#v}" --tag "${EXPECTED_TAG}"
          else
            scripts/verify-release-version.sh "$(node -p 'require("./package.json").version')"
            test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          fi

      - name: Read reviewed release inputs
        id: build-inputs
        run: |
          node scripts/verify-release-build-inputs.mjs
          node --test scripts/test-release-build-inputs.mjs
          echo "node=$(jq -r .nodeVersion build/release-inputs.json)" >> "$GITHUB_OUTPUT"
          echo "rust=$(jq -r .rustVersion build/release-inputs.json)" >> "$GITHUB_OUTPUT"

      - name: Set up release Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ steps.build-inputs.outputs.node }}

      - name: Set up release Rust
        env:
          RELEASE_RUST: ${{ steps.build-inputs.outputs.rust }}
        run: |
          rustup toolchain install "$RELEASE_RUST" --profile minimal
          rustup override set "$RELEASE_RUST"
          node scripts/verify-release-build-inputs.mjs --runtime

      - name: Enable pinned pnpm
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@8.11.0 --activate

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Enforce reviewed dependency advisory policy
        run: |
          cargo install --locked --version 0.22.2 cargo-audit
          node --test scripts/test-audit-policy.mjs scripts/test-sbom.mjs
          node scripts/dependency-audit.mjs

      - name: Retain dependency audit results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dependency-audit-${{ github.run_id }}
          path: audit-reports/
          if-no-files-found: warn
          retention-days: 30

      - name: Verify Docker build context policy
        run: scripts/check-docker-context.sh

      - name: Build in Docker without shared caches
        run: |
          set -euo pipefail
          rm -rf release-artifacts
          mkdir -p release-artifacts
          docker build \
            --pull \
            --no-cache \
            --build-arg RICE_GIT_COMMIT="${GITHUB_SHA}" \
            --build-arg SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" \
            --build-arg RICE_TWITCH_CLIENT_ID="${RICE_TWITCH_CLIENT_ID}" \
            --target artifacts \
            --output type=local,dest=release-artifacts \
            .

      - name: Generate artifact-bound CycloneDX SBOM
        run: node scripts/generate-sbom.mjs release-artifacts

      - name: Verify artifacts and write checksums
        run: |
          set -euo pipefail
          node --test scripts/test-release-artifacts.mjs scripts/test-windows-smoke.mjs
          node scripts/verify-release-artifacts.mjs release-artifacts --write --tag "${EXPECTED_TAG}" --commit "${GITHUB_SHA}"
          node scripts/verify-release-artifacts.mjs release-artifacts --tag "${EXPECTED_TAG}" --commit "${GITHUB_SHA}"

      - name: Upload release artifact bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rice-windows-${{ github.run_id }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 1

      - name: Upload immutable release provenance
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rice-release-provenance-${{ github.ref_name }}
          path: release-provenance.json
          if-no-files-found: error
          retention-days: 1

  windows-smoke:
    name: Smoke exact Windows release artifacts
    needs: [build-windows, windows-tests]
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      EXPECTED_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read reviewed Node version
        id: inputs
        run: |
          $inputs = Get-Content build/release-inputs.json -Raw | ConvertFrom-Json
          "node=$($inputs.nodeVersion)" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ steps.inputs.outputs.node }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rice-windows-${{ github.run_id }}
          path: release-artifacts
      - name: Install, launch and uninstall exact release candidates
        run: |
          node --test scripts/test-checkout-materials.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Canonical checkout material tests failed' }
          ./scripts/smoke-windows-artifacts.ps1 -Artifacts release-artifacts -Commit $env:GITHUB_SHA -Tag $env:EXPECTED_TAG
      - name: Retain Windows smoke receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rice-windows-smoke-${{ github.run_id }}
          path: windows-smoke-report.json
          if-no-files-found: error
          retention-days: 1
