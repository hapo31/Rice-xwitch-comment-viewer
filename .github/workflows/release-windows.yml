name: Release Windows

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: read

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Test and build Windows installer and zip
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      DOCKER_BUILDKIT: "1"
      RICE_TWITCH_CLIENT_ID: ${{ vars.RICE_TWITCH_CLIENT_ID || secrets.RICE_TWITCH_CLIENT_ID }}
    steps:
      - name: Checkout annotated tag
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable release source
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "エラー: タグ名は vX.Y.Z 形式で指定してください: ${GITHUB_REF_NAME}" >&2
            exit 64
          fi
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "refs/tags/${GITHUB_REF_NAME}:refs/rice/release-tag"
          scripts/verify-release-tag.sh "${GITHUB_REF_NAME}" \
            --tag-ref refs/rice/release-tag \
            --expected-commit "${GITHUB_SHA}" \
            --checkout-ref HEAD \
            --main-ref refs/remotes/origin/main

          tag_object="$(git rev-parse refs/rice/release-tag^{tag})"
          jq -n \
            --arg tag "${GITHUB_REF_NAME}" \
            --arg tagObject "${tag_object}" \
            --arg commit "${GITHUB_SHA}" \
            '{schemaVersion: 1, tag: $tag, tagObject: $tagObject, commit: $commit}' \
            > release-provenance.json

      - name: Verify manifest and tag versions
        run: scripts/verify-release-version.sh "${GITHUB_REF_NAME#v}" --tag "${GITHUB_REF_NAME}"

      - name: Enable pinned pnpm
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@8.11.0 --activate

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Test frontend and run TypeScript build
        run: |
          set -euo pipefail
          pnpm test
          pnpm build

      - name: Install Linux dependencies for Rust tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev

      - name: Test Rust backend
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Verify Docker build context policy
        run: scripts/check-docker-context.sh

      - name: Build in Docker without shared caches
        run: |
          set -euo pipefail
          if [ -z "${RICE_TWITCH_CLIENT_ID}" ]; then
            echo "::warning::RICE_TWITCH_CLIENT_ID is not configured. The app will build, but Twitch login will show a setup error until a client ID is provided at build time."
          fi
          rm -rf release-artifacts
          mkdir -p release-artifacts
          docker build \
            --pull \
            --no-cache \
            --build-arg RICE_TWITCH_CLIENT_ID="${RICE_TWITCH_CLIENT_ID}" \
            --target artifacts \
            --output type=local,dest=release-artifacts \
            .

      - name: Verify artifacts and write checksums
        run: |
          set -euo pipefail
          find release-artifacts -maxdepth 1 -type f -print
          test -n "$(find release-artifacts -maxdepth 1 -type f -name '*.exe' -print -quit)"
          test -n "$(find release-artifacts -maxdepth 1 -type f -name '*.zip' -print -quit)"
          (cd release-artifacts && sha256sum * > SHA256SUMS.txt)

      - name: Upload release artifact bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rice-windows-${{ github.ref_name }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 1

      - name: Upload immutable release provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rice-release-provenance-${{ github.ref_name }}
          path: release-provenance.json
          if-no-files-found: error
          retention-days: 1
