name: Rust feature matrix

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-features-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Rust tests (${{ matrix.features }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        features: [default, no-default]
    env:
      # A GUI-only import leaking into the headless build must fail CI.
      RUSTFLAGS: -D unused-imports
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - name: Install keyring build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - name: Install Tauri build dependencies
        if: matrix.features == 'default'
        run: |
          sudo apt-get install -y --no-install-recommends \
            libayatana-appindicator3-dev libgtk-3-dev librsvg2-dev libwebkit2gtk-4.1-dev
          mkdir -p dist
      - name: Test default features
        if: matrix.features == 'default'
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Test without the Tauri app
        if: matrix.features == 'no-default'
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features
