[package]
name = "rice"
version = "0.2.3"
description = "Twitch chat TTS desktop app"
authors = ["Rice contributors"]
license = "MIT"
repository = "https://github.com/hapo31/Rice-xwitch-comment-viewer"
edition = "2021"

[lib]
name = "rice_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
anyhow = "1.0"
base64 = "0.23"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
png = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tauri = { version = "2.12.1", features = [], optional = true }
tauri-plugin-dialog = { version = "2.8.1", optional = true }
tauri-plugin-single-instance = { version = "=2.5.2", optional = true }
thiserror = "2.0"
tempfile = "=3.27.0"
tokio = { version = "1.41", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
keyring = { version = "3.6", default-features = false }
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["apple-native"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging"] }
windows = { version = "=0.62.2", features = ["Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_Shell"] }

[features]
default = ["app"]
app = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-plugin-single-instance", "custom-protocol"]
custom-protocol = ["tauri?/custom-protocol"]

[dev-dependencies]
tokio = { version = "1.41", features = ["test-util"] }
ts-rs = { version = "12.0.1", features = ["chrono-impl"] }
